<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM Eco-Roy</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eco-Roy">
<style>
:root{
  --bg:#f6f7f5;--card:#ffffff;--ink:#17201b;--muted:#5d6b63;--line:#e2e6e3;
  --brand:#14532d;--brand-2:#1f7a45;--brand-soft:#e6f2ea;--accent:#d97706;
  --danger:#b42318;--danger-soft:#fdecea;--warn:#a15c00;--warn-soft:#fff4e0;--ok:#1f7a45;--ok-soft:#e6f2ea;
  --bleu:#2459c9;--jaune:#c28a00;--violet:#7a3fc4;--rose:#cc3d7a;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,20,.06),0 2px 8px rgba(16,24,20,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f1512;--card:#171f1b;--ink:#e8eee9;--muted:#9aa8a0;--line:#26312b;
  --brand:#3fb26f;--brand-2:#56c784;--brand-soft:#173323;--accent:#f0a33a;
  --danger:#ff7b72;--danger-soft:#3a1715;--warn:#f0b35a;--warn-soft:#33260f;--ok:#56c784;--ok-soft:#173323;
  --shadow:none;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1512;--card:#171f1b;--ink:#e8eee9;--muted:#9aa8a0;--line:#26312b;
  --brand:#3fb26f;--brand-2:#56c784;--brand-soft:#173323;--accent:#f0a33a;
  --danger:#ff7b72;--danger-soft:#3a1715;--warn:#f0b35a;--warn-soft:#33260f;--ok:#56c784;--ok-soft:#173323;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.app{max-width:1100px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--card);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.pending{background:var(--accent)}.dot.off{background:var(--danger)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;padding:9px 4px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand-2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted)}
h2{font-size:16px;margin:20px 0 8px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#08130c}}
.chip b{font-weight:700;margin-left:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand-2);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.grey{background:var(--line);color:var(--muted)}
.pastille{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.c-bleu{background:var(--bleu)}.c-jaune{background:var(--jaune)}.c-violet{background:var(--violet)}.c-rose{background:var(--rose)}.c-none{background:var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#08130c}}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;width:54px;height:54px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media (prefers-color-scheme:dark){.fab{color:#08130c}}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],input[type=search],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-height:40px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f > span{padding-left:2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
@media(min-width:760px){.form.three{grid-template-columns:repeat(3,1fr)}}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--brand-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.dtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:4px 0 14px;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.dtabs button.on{color:var(--ink);border-color:var(--brand-2)}
.stepper{display:flex;gap:4px;margin:8px 0 4px}
.stepper i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepper i.on{background:var(--brand-2)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px;cursor:pointer}
.alert.danger{background:var(--danger-soft)}
.alert .ic{font-weight:700;color:var(--warn)}
.alert.danger .ic{color:var(--danger)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pend{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 6px}
.addphoto{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;gap:2px}
.addphoto b{font-size:24px;line-height:1}
canvas.sig{width:100%;height:180px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:0}
.stars button.on{color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr{cursor:pointer}
.r{text-align:right}
.scroll-x{overflow-x:auto}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.modal{align-items:center}}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:760px){.modal .sheet{border-radius:18px}}
.back{background:none;border:0;padding:6px 8px 6px 0;font-size:22px;cursor:pointer;color:var(--ink)}
.login{max-width:420px;margin:8vh auto 0}
.logo{width:56px;height:56px;border-radius:14px;display:block;margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
.pill-etape{font-size:11px;font-weight:600;color:var(--muted)}
.big-num{font-size:28px;font-weight:700;letter-spacing:-.02em}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;scroll-snap-type:x proximity}
.kcol{flex:0 0 250px;background:var(--brand-soft);border-radius:12px;padding:8px;scroll-snap-align:start;min-height:120px}
.khead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;font-size:13px}
.kbody{display:flex;flex-direction:column;gap:6px}
.kcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 9px;cursor:grab;display:grid;gap:2px}
.kmove{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:var(--brand-soft);color:var(--brand-2);border-radius:8px;width:24px;height:24px;cursor:pointer;font-weight:700}
.dragging{opacity:.45}.dropover{outline:2px dashed var(--brand-2);outline-offset:-2px}
.mapbox{height:min(62vh,560px);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:var(--line)}
.mnum{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
table.plan{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
table.plan th{font-size:12px;font-weight:600;color:var(--muted);padding:4px;text-align:center}
table.plan th.pname{text-align:left;color:var(--ink);width:90px}
table.plan td{background:var(--card);border:1px solid var(--line);border-radius:10px;vertical-align:top;padding:4px;height:72px;width:13%}
table.plan td.today,table.plan th.today{background:var(--brand-soft)}
table.plan td.over{border-color:var(--danger);background:var(--danger-soft)}
.pchip{background:var(--brand-soft);border-left:0;border-radius:8px;padding:4px 6px;font-size:12px;margin-bottom:4px;cursor:grab;line-height:1.3}
.pchip.warn{background:var(--warn-soft)}.pchip.done{background:var(--line);color:var(--muted)}.pchip.suite{opacity:.6}
.pchip span{color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script>
"use strict";
/* ============================================================
   CRM Eco-Roy — PWA hors ligne
   Données locales (IndexedDB) + synchro Google Apps Script
   ============================================================ */

/* ---------- Référentiels ---------- */
const ETAPES = [
  {n:1, l:"Lead reçu"},
  {n:2, l:"Qualifié"},
  {n:3, l:"Éligible · pièces"},
  {n:4, l:"Déposé OPX"},
  {n:5, l:"Validé · à programmer"},
  {n:6, l:"Pose programmée"},
  {n:7, l:"Installé"},
  {n:8, l:"Demande de solde"},
  {n:9, l:"Soldé"},
  {n:0, l:"Perdu / infaisable"},
];
const etapeLabel = n => (ETAPES.find(e=>e.n===Number(n))||{l:"?"}).l;
const SOURCES = ["Site internet","Call Maroc","Hello Artisan","Effy","Igor","Parrainage","Apporteur","Direct","Autre"];
const PRODUITS = ["PAC air/eau","PAC + ballon thermo","PAC + ballon élec","Ballon thermodynamique","SSC","ITE","Photovoltaïque","Autre"];
const FOURNISSEURS = ["Axdis","Brother Négoce","LM Plastic","Elle M","Fourni-posé","Autre"];
const STATUT_OPX = ["À déposer","Déposé","Validé","Paiement demandé","Payé","Refusé"];
const STATUT_MPR = ["À déposer","Attente code","Déposé","Octroyé","Paiement demandé","Payé","Non concerné"];
const CHAUFFAGES = ["Chaudière gaz","Chaudière fioul","Électrique","Bois","PAC existante","Autre"];

/* Plafonds RFR MaPrimeRénov' 2026 (Anah, janv. 2026) — [1..5 pers], + par pers. sup. */
const PLAFONDS = {
  idf:  {bleu:[24031,35270,42357,49455,56580,7116], jaune:[29253,42933,51564,60208,68877,8663], violet:[40851,60051,71846,84562,96817,12257]},
  hors: {bleu:[17363,25393,30540,35676,40835,5151], jaune:[22259,32553,39148,45735,52348,6598], violet:[31185,45842,55196,64550,73907,9357]},
};
const AIDE_MPR_PAC = {bleu:5000, jaune:4000, violet:3000, rose:0};
const DEPT_IDF = ["75","77","78","91","92","93","94","95"];
const ZONE_H1 = "01 02 03 05 08 10 14 15 19 21 23 25 27 28 38 39 42 43 45 51 52 54 55 57 58 59 60 61 62 63 67 68 69 70 71 73 74 75 76 77 78 80 87 88 89 90 91 92 93 94 95".split(" ");
const ZONE_H3 = "06 11 13 20 2A 2B 30 34 66 83 84".split(" ");

function dept(cp){ cp=String(cp||"").replace(/\s/g,""); if(cp.length===4) cp="0"+cp; if(!/^\d{5}$/.test(cp)) return ""; if(cp.startsWith("97")) return cp.slice(0,3); return cp.slice(0,2); }
function isIDF(cp){ return DEPT_IDF.includes(dept(cp)); }
function zoneClim(cp){ const d=dept(cp); if(!d) return ""; if(ZONE_H1.includes(d)) return "H1"; if(ZONE_H3.includes(d)) return "H3"; return "H2"; }
function plafond(table, n){ n=Math.max(1,Number(n)||1); return n<=5 ? table[n-1] : table[4] + (n-5)*table[5]; }
function couleurCalc(rfr, n, cp){
  if(rfr===""||rfr==null||isNaN(Number(rfr))||!n) return "";
  const t = isIDF(cp) ? PLAFONDS.idf : PLAFONDS.hors; rfr=Number(rfr);
  if(rfr<=plafond(t.bleu,n)) return "bleu";
  if(rfr<=plafond(t.jaune,n)) return "jaune";
  if(rfr<=plafond(t.violet,n)) return "violet";
  return "rose";
}
const couleurOf = d => d.couleurForcee || couleurCalc(d.rfr, d.nbPersonnes, d.cp);

/* ---------- Utilitaires ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n=Number(String(v==null?"":v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:0; };
const eur = v => (Math.round(num(v))).toLocaleString("fr-FR")+" €";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
const daysSince = ts => ts ? Math.floor((Date.now()-new Date(ts).getTime())/864e5) : null;
const fmtDate = s => { if(!s) return ""; const d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); };
const telLink = t => { const c=String(t||"").replace(/[^\d+]/g,""); return c?`<a href="tel:${esc(c)}" onclick="event.stopPropagation()">${esc(t)}</a>`:""; };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const fullName = d => [d.nom, d.prenom].filter(Boolean).join(" ") || "Sans nom";
const isPAC = d => /pac/i.test(d.produit||"");

/* ---------- Calculs dossier ---------- */
function couts(d){ return num(d.prixMateriel)+num(d.prixPoseur)+num(d.commission); }
function recettesPrev(d){ return num(d.valoCEE)+num(d.valoMPR)+num(d.rac); }
function margePrev(d){ return recettesPrev(d)-couts(d); }
function encaisse(d){ return num(d.encaisseCEE)+num(d.encaisseMPR)+num(d.rac); }
function margeEncaissee(d){ return encaisse(d)-couts(d); }
function resteAEncaisser(d){ return Math.max(0,num(d.valoCEE)-num(d.encaisseCEE))+Math.max(0,num(d.valoMPR)-num(d.encaisseMPR)); }
function piecesOK(d){ return !!(d.pAvis && d.pCni && d.pDevis); }
function photosOf(d,kind){ return (d.photos||[]).filter(p=>p.kind===kind && !p.del); }

function alertsFor(d){
  const a=[]; const e=Number(d.etape);
  if(e===0) return a;
  if(e===1 && daysSince(d.createdAt)>=1) a.push({lvl:"danger",t:"Lead non traité depuis "+daysSince(d.createdAt)+" j"});
  if(e>=2 && e<=3 && !piecesOK(d)) a.push({lvl:"warn",t:"Pièces manquantes : "+[!d.pAvis&&"avis d'impôt",!d.pCni&&"CNI",!d.pDevis&&"devis"].filter(Boolean).join(", ")});
  if(e>=2 && e<=3 && d.rfr==="" ) a.push({lvl:"warn",t:"RFR non renseigné"});
  if(e===4 && daysSince(d.dateDepotOPX)>=10) a.push({lvl:"warn",t:"OPX déposé il y a "+daysSince(d.dateDepotOPX)+" j sans retour"});
  if(e>=5 && e<=6 && d.datePose){ const j=-daysSince(d.datePose); if(j<=2 && j>=0 && !d.dateCommande) a.push({lvl:"danger",t:"Pose dans "+j+" j et matériel non commandé"}); }
  if(e>=5 && e<=6 && !d.poseur) a.push({lvl:"warn",t:"Aucun poseur affecté"});
  if(e>=7 && e<=8 && photosOf(d,"apres").length===0) a.push({lvl:"warn",t:"Pas de photo après travaux"});
  if(e>=7 && e<=8 && !(d.satisfaction&&d.satisfaction.note)) a.push({lvl:"warn",t:"Fiche satisfaction non signée"});
  if(e>=7 && e<=8 && d.statutMPR==="À déposer" && couleurOf(d)!=="rose") a.push({lvl:"warn",t:"Demande MPR à déposer"});
  if(e===8 && resteAEncaisser(d)>0 && daysSince(d.dateDemandeSolde)>=30) a.push({lvl:"danger",t:"Solde demandé il y a "+daysSince(d.dateDemandeSolde)+" j — "+eur(resteAEncaisser(d))+" à encaisser"});
  if(e>=3 && e<=8 && couts(d)>0 && recettesPrev(d)>0 && margePrev(d)<1000) a.push({lvl:"danger",t:"Marge prévisionnelle faible : "+eur(margePrev(d))});
  return a;
}

/* ---------- Stockage local (IndexedDB) ---------- */
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("ecoroy-crm",1);
    r.onupgradeneeded=()=>{ const db=r.result; db.createObjectStore("dossiers",{keyPath:"id"}); db.createObjectStore("outbox",{keyPath:"id"}); db.createObjectStore("blobs",{keyPath:"id"}); };
    r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>rej(r.error); }); },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); }); },
  all(store){ return new Promise((res,rej)=>{ const r=this.db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  get(store,id){ return new Promise((res,rej)=>{ const r=this.db.transaction(store).objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  put(store,v){ return this.tx(store,"readwrite",s=>{s.put(v)}); },
  del(store,id){ return this.tx(store,"readwrite",s=>{s.delete(id)}); },
  clear(store){ return this.tx(store,"readwrite",s=>{s.clear()}); },
};

/* ---------- Synchro serveur (Apps Script) ---------- */
let syncTimer=null, syncing=false;
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, ms==null?1500:ms); }
async function api(action, payload){
  const body=JSON.stringify(Object.assign({action, auth:{token:CFG.token, poseur:CFG.poseur, pin:CFG.pin}}, payload||{}));
  const r=await fetch(CFG.url,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow"});
  if(!r.ok) throw new Error("Serveur "+r.status);
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}
let syncAgain=false;
async function syncNow(){
  if(CFG.role==="demo" || !CFG.url) return;
  if(syncing){ syncAgain=true; return; }
  if(!navigator.onLine){ S.sync={state:"off",msg:"Hors ligne"}; renderSync(); return; }
  syncing=true; S.sync={state:"pending",msg:"Synchro…"}; renderSync();
  try{
    // 1. Envoi des photos en attente
    const blobs=(await DB.all("blobs")).filter(b=>!b.uploaded);
    for(const b of blobs){
      const res=await api("upload",{dossierId:b.dossierId,photoId:b.id,kind:b.kind,full:b.full,thumb:b.thumb,name:b.name});
      const d=S.dossiers.get(b.dossierId);
      if(d){ const p=(d.photos||[]).find(x=>x.id===b.id); if(p){ p.fileId=res.fileId; p.thumbId=res.thumbId; p.url=res.url; p.pending=false; await saveDossier(d,{silent:true}); } }
      b.uploaded=true; delete b.full; await DB.put("blobs",b);
    }
    // 2. Envoi des modifications
    const out=await DB.all("outbox");
    if(out.length){
      const records=out.map(o=>S.dossiers.get(o.id)).filter(Boolean);
      for(let i=0;i<records.length;i+=40){
        const chunk=records.slice(i,i+40);
        const res=await api("push",{records:chunk});
        for(const rec of (res.records||[])){
          const local=S.dossiers.get(rec.id); const ob=out.find(o=>o.id===rec.id);
          if(local && ob && local.updatedAt>ob.at) continue; // modifié pendant l'envoi
          S.dossiers.set(rec.id,rec); await DB.put("dossiers",rec); await DB.del("outbox",rec.id);
        }
      }
    }
    // 3. Récupération des nouveautés
    const res=await api("pull",{since:CFG.lastSync||0});
    const pendingIds=new Set((await DB.all("outbox")).map(o=>o.id));
    for(const rec of (res.records||[])){
      if(pendingIds.has(rec.id)) continue;
      if(rec._deleted){ S.dossiers.delete(rec.id); await DB.del("dossiers",rec.id); continue; }
      S.dossiers.set(rec.id,rec); await DB.put("dossiers",rec);
    }
    if(res.full){ // le serveur renvoie la liste complète des ids visibles : on retire le reste (poseur)
      const keep=new Set(res.ids||[]); for(const id of [...S.dossiers.keys()]) if(!keep.has(id) && !pendingIds.has(id)){ S.dossiers.delete(id); await DB.del("dossiers",id); }
    }
    CFG.lastSync=res.now; CFG.lastSyncAt=Date.now(); saveCfg();
    if(!S._setLoaded){ S._setLoaded=true; await pullSettings(); }
    S.outbox=(await DB.all("outbox")).length;
    S.sync={state:"ok",msg:"À jour"};
    safeRender();
  }catch(e){
    console.error(e); S.sync={state:"off",msg:navigator.onLine?"Erreur synchro":"Hors ligne",err:String(e.message||e)};
  }finally{ syncing=false; renderSync(); if(syncAgain){ syncAgain=false; scheduleSync(300); } }
}
window.addEventListener("online",()=>scheduleSync(200));
window.addEventListener("offline",()=>{S.sync={state:"off",msg:"Hors ligne"};renderSync();});
setInterval(()=>{ if(document.visibilityState==="visible") syncNow(); }, 60000);

function compress(file, max, q){
  return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Image illisible"))}; img.src=url; });
}
async function addPhotos(d, kind, files){
  for(const f of files){
    const id=uid(); const full=await compress(f,1600,.78); const thumb=await compress(f,360,.6);

function F(d,key,label,type,opts){ // champ de formulaire lié
  opts=opts||{}; const v=d[key]==null?"":d[key]; const cls=opts.full?"f full":"f";
  if(type==="select") return `<label class="${cls}"><span>${label}</span><select data-field="${key}">${(opts.allowEmpty?['<option value=""></option>']:[]).concat(opts.options.map(o=>{const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(lab)}</option>`;})).join("")}</select></label>`;
  if(type==="textarea") return `<label class="${cls}"><span>${label}</span><textarea data-field="${key}" placeholder="${esc(opts.ph||"")}">${esc(v)}</textarea></label>`;
  if(type==="check") return `<label class="check ${opts.full?"full":""}"><input type="checkbox" data-field="${key}" ${v?"checked":""}>${label}</label>`;
  const im = type==="number"?' inputmode="decimal"':"";
  return `<label class="${cls}"><span>${label}</span><input type="${type==="number"?"text":type}"${im} data-field="${key}" value="${esc(v)}" placeholder="${esc(opts.ph||"")}"></label>`;
}

let sigDirty=false;
function initSignature(c){
  const r=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr;
  const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111";
  let drawing=false; sigDirty=false;
  const pos=e=>{const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{drawing=true; c.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y);};
  c.onpointermove=e=>{ if(!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); sigDirty=true; };
  c.onpointerup=c.onpointercancel=()=>{drawing=false;};
}

/* ============================================================
   Formulaire de qualification dynamique (nouveau lead / lead à qualifier)
   Les questions s'enchaînent selon les réponses ; à la fin, tout
   remplit la fiche et le dossier s'ouvre sur sa première page.

const isGazFioul = a => /gaz|fioul|bois/i.test(a.chauffage||"");
const isElec = a => /lectrique/i.test(a.chauffage||"");
const hasRad = a => /radiateur/i.test(a.emetteursType||"");
const WQ = [
  {id:"source", t:"D'où vient ce client ?", type:"choice", opts:SOURCES},
  {id:"contact", t:"Coordonnées du client", type:"fields", fields:[["nom","Nom","text"],["prenom","Prénom","text"],["tel","Téléphone","tel"],["email","E-mail","email"],["adresse","Adresse","text",true],["cp","Code postal","cp"],["ville","Ville","text"]],
    valid:a=>(a.nom||a.tel)?"":"Mets au moins le nom ou le téléphone."},
  {id:"habitat", t:"Quel type de logement ?", type:"choice", opts:["Maison individuelle","Appartement"]},
  {id:"chauffIndiv", t:"Le chauffage est-il individuel ?", type:"choice", opts:["Oui","Non, chauffage collectif"], show:a=>a.habitat==="Appartement"},
  {id:"proprietaire", t:"Le client est…", type:"choice", opts:["Propriétaire occupant","Propriétaire bailleur","Locataire","SCI"]},
  {id:"plus15", t:"Le logement a plus de 15 ans ?", type:"choice", opts:["Oui","Non","Ne sait pas"], hint:"MaPrimeRénov' exige un logement construit depuis plus de 15 ans."},
  {id:"chauffage", t:"Comment se chauffe-t-il aujourd'hui ?", type:"choice", opts:CHAUFFAGES},
  {id:"ageChaudiere", t:"La chaudière a quel âge ?", type:"choice", opts:["Moins de 10 ans","10 à 20 ans","Plus de 20 ans","Ne sait pas"], show:isGazFioul},
  {id:"emplacement", t:"Où se trouve la chaudière ?", type:"choice", opts:["Cuisine","Garage","Cave / sous-sol","Chaufferie / local technique","Autre"], show:isGazFioul},
  {id:"emetteursType", t:"Quels émetteurs de chaleur ?", type:"choice", opts:["Radiateurs à eau","Plancher chauffant","Radiateurs + plancher"], show:a=>!isElec(a)},
  {id:"nbRad", t:"Combien de radiateurs à eau ?", type:"number", unit:"radiateurs", show:hasRad},
  {id:"typeRad", t:"Les radiateurs sont en…", type:"choice", opts:["Fonte","Acier","Aluminium","Ne sait pas"], show:hasRad},
  {id:"ecs", t:"Comment est produite l'eau chaude ?", type:"choice", opts:["Par la chaudière","Ballon électrique","Ballon thermodynamique","Autre"]},
  {id:"surface", t:"Surface chauffée et niveaux", type:"fields", fields:[["surface","Surface (m²)","num"],["niveaux","Nombre de niveaux","num"]]},
  {id:"compteur", t:"Compteur électrique", type:"choice", opts:["Mono","Tri","Ne sait pas"]},
  {id:"foyer", t:"Composition du foyer et revenus", type:"fields", fields:[["nbPersonnes","Personnes au foyer","num"],["rfr","Revenu fiscal de référence (€)","num"]], hint:"Ligne « revenu fiscal de référence » de l'avis d'impôt. Laisse vide s'il ne sait pas.", live:"couleur"},
  {id:"deja", t:"A-t-il déjà eu une PAC ou un SSC aidé (offre 1 €) ?", type:"choice", opts:["Non","Oui"]},
  {id:"delai", t:"Quand veut-il faire les travaux ?", type:"choice", opts:["Dès que possible","Dans les 3 mois","Plus tard / se renseigne"]},
  {id:"previsite", t:"Une prévisite est nécessaire ?", type:"choice", opts:["Non","Oui"]},
  {id:"resume", t:"Résultat", type:"summary"},
];
function wizVisible(){ const a=S.wiz.a; return WQ.filter(q=>!q.show||q.show(a)); }
function wizAnalyse(a){
  const bloq=[], warn=[]; let s=0;
  if(a.habitat==="Appartement" && /collectif/.test(a.chauffIndiv||"")) bloq.push("Chauffage collectif : PAC individuelle impossible");
  if(a.proprietaire==="Locataire") warn.push("Locataire : il faut l'accord et le dossier du propriétaire");
  if(a.proprietaire==="Propriétaire bailleur") warn.push("Bailleur : MPR possible avec engagement de location");
  if(a.plus15==="Non") bloq.push("Logement de moins de 15 ans : pas de MaPrimeRénov'");
  if(isElec(a)) bloq.push("Chauffage électrique sans circuit d'eau : pas de PAC air/eau (proposer ballon thermo ou PAC air/air)");
  if(a.deja==="Oui") bloq.push("A déjà bénéficié d'une PAC/SSC aidé : CEE et MPR probablement refusés");
  const coul=couleurCalc(a.rfr,a.nbPersonnes,a.cp);
  if(/^Propri/.test(a.proprietaire||"") && a.proprietaire!=="Propriétaire bailleur") s+=20;
  if(a.habitat==="Maison individuelle") s+=15;
  if(isGazFioul(a)) s+=20;
  if(num(a.surface)>=70) s+=10;
  if(a.plus15==="Oui") s+=5;
  s += ({bleu:25,jaune:20,violet:10,rose:0})[coul]||0;
  s += ({"Dès que possible":10,"Dans les 3 mois":5})[a.delai]||0;
  if(/Plus de 20/.test(a.ageChaudiere||"")) s+=5;
  if(bloq.length) s=Math.min(s,20);
  s=Math.max(0,Math.min(100,s));
  let produit="PAC air/eau";
  if(isElec(a)) produit="Ballon thermodynamique";
  else if(a.ecs==="Ballon électrique") produit="PAC + ballon thermo";
  if(coul==="rose") warn.push("Profil rose : pas de MPR par geste, dossier CEE seul");
  if(a.compteur==="Mono" && num(a.surface)>=180) warn.push("Grande surface en monophasé : vérifier la puissance de la PAC");
  if(a.previsite==="Oui") warn.push("Prévisite à planifier");
  return {score:s, temp:s>=70?"chaud":s>=45?"tiède":"froid", couleur:coul, produit, bloq, warn, aide:isPAC({produit})&&coul?AIDE_MPR_PAC[coul]:null};
}
function openWizard(d){
  const a={};
  if(d){ for(const k of ["source","nom","prenom","tel","email","adresse","cp","ville","habitat","proprietaire","chauffage","surface","compteur","nbPersonnes","rfr"]) if(d[k]) a[k]=d[k]; Object.assign(a,d.qualif||{}); }
  if(!a.source) a.source = d ? d.source : "";
  S.wiz={a, i:0, dossierId:d?d.id:null};
  renderWizard();
}
function renderWizard(){
  const vis=wizVisible(); const i=Math.min(S.wiz.i,vis.length-1); S.wiz.i=i; const q=vis[i]; const a=S.wiz.a;
  let body="";
  if(q.type==="choice") body=`<div class="grid" style="grid-template-columns:1fr">${q.opts.map(o=>`<button class="btn wopt ${a[q.id]===o?"primary":""}" data-act="wchoose" data-v="${esc(o)}" style="justify-content:flex-start;padding:13px 14px">${esc(o)}</button>`).join("")}</div>`;
  if(q.type==="number") body=`<div class="row"><input type="text" inputmode="numeric" class="wf" data-k="${q.id}" value="${esc(a[q.id]||"")}" style="font-size:20px"><span class="muted">${esc(q.unit||"")}</span></div>`;

let LEAF=null, MAP=null, MAPLAYER=null;

}
function viewCarte(){

async function initCarte(){
  const el=$("#map"); if(!el) return;
  let L; try{ L=await loadLeaflet(); }catch(e){ el.innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  if(MAP){ MAP.remove(); MAP=null; }
  MAP=L.map(el,{zoomControl:true}).setView([46.6,2.4],6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(MAP);

function mapDossiers(){

  if(f.poseur) list=list.filter(d=>String(d.poseur||"").toLowerCase().includes(f.poseur.toLowerCase()));

function drawCarte(fit){
  if(!MAP||!window.L) return; const L=window.L; MAPLAYER.clearLayers();
  const list=mapDossiers(); const pts=[];
  if(S.mapF.mode==="tournee"){
    const byKey={}; for(const d of list){ const k=d.datePose+"|"+(d.poseur||"?"); (byKey[k]=byKey[k]||[]).push(d); }
    const palette=["#d97706","#2459c9","#7a3fc4","#1f7a45","#cc3d7a","#0e7490"]; let i=0;
    const rows=[];
    for(const k of Object.keys(byKey).sort()){ const [date,pos]=k.split("|"); const ds=byKey[k]; const col=palette[i++%palette.length];
      ds.forEach((d,n)=>{ const ll=[d.geo.lat,d.geo.lon]; pts.push(ll);
        L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="mnum" style="background:${col}">${n+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).bindPopup(popupHtml(d)).addTo(MAPLAYER); });
      if(ds.length>1) L.polyline(ds.map(d=>[d.geo.lat,d.geo.lon]),{color:col,weight:3,opacity:.7,dashArray:"6 6"}).addTo(MAPLAYER);
      rows.push(`<div class="card row"><span class="pastille" style="background:${col}"></span><div class="grow"><b>${fmtDate(date)}</b> · ${esc(pos)}<div class="small muted">${ds.map(d=>esc(fullName(d))+" ("+esc(d.ville||d.cp)+")").join(" → ")}</div></div></div>`);
    }
    $("#mapList").innerHTML=rows.join("")||'<div class="card empty small">Aucune pose à venir avec une adresse localisée.</div>';
  } else {
    for(const d of list){ const g=groupeOf(d); const ll=[d.geo.lat,d.geo.lon]; pts.push(ll);
      L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:g?g.c:"#888",fillOpacity:.95}).bindPopup(popupHtml(d)).addTo(MAPLAYER); }
    const byDep={}; for(const d of list){ const k=dept(d.cp)||"?"; byDep[k]=(byDep[k]||0)+1; }
    const top=Object.entries(byDep).sort((a,b)=>b[1]-a[1]).slice(0,8);
    $("#mapList").innerHTML=`<div class="card"><h3>Top départements</h3><div class="row wrap" style="gap:6px">${top.map(([k,n])=>`<span class="chip">${esc(k)}<b>${n}</b></span>`).join("")}</div><div class="small muted" style="margin-top:8px">${list.length} dossier(s) affiché(s)</div></div>`;
  }
  if(fit && pts.length) MAP.fitBounds(pts,{padding:[30,30],maxZoom:11});
}
function popupHtml(d){ return `<b>${esc(fullName(d))}</b><br>${esc(etapeLabel(d.etape))}<br>${esc([d.adresse,d.cp,d.ville].filter(Boolean).join(" "))}${d.datePose?`<br>Pose : ${fmtDate(d.datePose)} · ${esc(d.poseur||"")}`:""}<br><a href="#" data-open="${esc(d.id)}">Ouvrir le dossier</a>`; }
let geocoding=false;
async function geocodeMissing(){
  if(geocoding||!navigator.onLine) return; geocoding=true;
  const todo=actifs().filter(d=>Number(d.etape)!==0 && !d.geo && !d.geoFail && (d.cp||d.ville));
  let done=0;
  for(let i=0;i<todo.length;i+=8){
    await Promise.all(todo.slice(i,i+8).map(async d=>{
      const cp=String(d.cp||"").replace(/\D/g,"").padStart(5,"0");
      const q=[d.adresse,d.ville||""].filter(Boolean).join(" ")||cp;
      try{ const r=await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=1${/^\d{5}$/.test(cp)?"&postcode="+cp:""}`); const j=await r.json();
        const f=j.features&&j.features[0];
        if(f){ d.geo={lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],score:Math.round(f.properties.score*100)/100,label:f.properties.label}; }
        else if(/^\d{5}$/.test(cp)){ const r2=await fetch(`https://api-adresse.data.gouv.fr/search/?q=${cp}&type=municipality&limit=1`); const j2=await r2.json(); const f2=j2.features&&j2.features[0];
          if(f2) d.geo={lat:f2.geometry.coordinates[1],lon:f2.geometry.coordinates[0],score:0,label:f2.properties.label}; else d.geoFail=true; }
        else d.geoFail=true;
        await saveDossier(d,{silent:true});
      }catch(e){ /* réseau : on réessaiera */ }
    }));
    done=Math.min(todo.length,i+8); const info=$("#mapInfo"); if(info) info.textContent=done<todo.length?`Localisation des adresses : ${done}/${todo.length}…`:""; drawCarte(false);
  }
  geocoding=false; if(todo.length){ drawCarte(true); scheduleSync(); }
}

function mondayOf(dt){ const d=new Date(dt); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); d.setHours(12,0,0,0); return d; }
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function viewPlanningVisuel(){
  const start=S.week?new Date(S.week):mondayOf(new Date());
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
  const ps=poseursList();
  const enCours=actifs().filter(d=>[5,6,7].includes(Number(d.etape)));
  const aProg=actifs().filter(d=>[5,6].includes(Number(d.etape)) && !d.datePose);
  const occupe=(p,day)=>enCours.filter(d=>{ if(!d.datePose || String(d.poseur||"").toLowerCase()!==p.toLowerCase()) return false; const s=new Date(d.datePose+"T12:00"); const n=Math.max(1,Number(d.dureeJours)||1); const e=new Date(s); e.setDate(e.getDate()+n-1); return day>=s && day<=e; });
  const sansPoseur=day=>enCours.filter(d=>d.datePose===iso(day) && !d.poseur);
  const todayIso=iso(new Date());
  let h=`<div class="row" style="gap:8px;margin-bottom:10px"><button class="btn" data-mact="week" data-v="-1">←</button><b class="grow" style="text-align:center">Semaine du ${days[0].toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</b><button class="btn" data-mact="week" data-v="0">Auj.</button><button class="btn" data-mact="week" data-v="1">→</button></div>`;
  if(aProg.length) h+=`<div class="card" style="margin-bottom:12px"><h3>À programmer (${aProg.length}) <span class="small muted" style="text-transform:none;letter-spacing:0;font-weight:400">— glisse sur une case, ou touche pour choisir</span></h3><div class="row wrap" style="gap:6px">${aProg.map(d=>chip(d)).join("")}</div></div>`;
  h+=`<div class="scroll-x"><table class="plan"><thead><tr><th></th>${days.map(d=>`<th class="${iso(d)===todayIso?"today":""}">${d.toLocaleDateString("fr-FR",{weekday:"short"})}<br><span class="small muted">${d.getDate()}/${d.getMonth()+1}</span></th>`).join("")}</tr></thead><tbody>`;
  for(const p of ps){ const cap=capacite(p);
    h+=`<tr><th class="pname">${esc(p)}<div class="small muted">${cap} équipe${cap>1?"s":""}</div></th>${days.map(day=>{ const occ=occupe(p,day); const over=occ.length>cap;
      return `<td data-drop-day="${iso(day)}" data-drop-poseur="${esc(p)}" class="${over?"over":""} ${iso(day)===todayIso?"today":""}">${occ.map(d=>chip(d, d.datePose!==iso(day))).join("")}${over?`<div class="small neg">⚠ ${occ.length}/${cap}</div>`:""}</td>`; }).join("")}</tr>`; }
  const sp=days.map(day=>sansPoseur(day));
  if(sp.some(x=>x.length)) h+=`<tr><th class="pname">Sans poseur</th>${sp.map((x,i)=>`<td data-drop-day="${iso(days[i])}" data-drop-poseur="">${x.map(d=>chip(d)).join("")}</td>`).join("")}</tr>`;
  h+=`</tbody></table></div><p class="small muted">Sur ordinateur : glisse une pose vers un autre jour ou un autre poseur. Sur téléphone : touche une pose pour la déplacer.</p>`;
  return h;
}

function viewGestion(){

function monthKey(ts){ const d=new Date(ts); if(isNaN(d)) return null; return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function viewPilotage(){
  const per=S.per||6; const now=new Date(); const months=[...Array(per)].map((_,i)=>{ const d=new Date(now.getFullYear(),now.getMonth()-(per-1-i),1); return monthKey(d); });
  const all=actifs(); const from=new Date(now.getFullYear(),now.getMonth()-(per-1),1).getTime();
  const leads=all.filter(d=>d.createdAt>=from && !d.aVerifier);
  const poses=all.filter(d=>Number(d.etape)>=7 && Number(d.etape)!==0 && (d.dateInstallation||d.datePose) && new Date(d.dateInstallation||d.datePose).getTime()>=from);
  const sum=(a,f)=>a.reduce((s,d)=>s+f(d),0);
  const ca=sum(poses,recettesPrev), mg=sum(poses,margePrev);
  const byM=months.map(m=>{ const p=poses.filter(d=>monthKey(d.dateInstallation||d.datePose)===m); return {m,ca:sum(p,recettesPrev),mg:sum(p,margePrev),n:p.length,enc:sum(p,encaisse)}; });
  const delais=poses.filter(d=>d.createdAt && !d.aVerifier).map(d=>(new Date(d.dateInstallation||d.datePose)-d.createdAt)/864e5).filter(x=>x>=0);
  const sources=[...new Set(all.map(d=>d.source||"Autre"))];
  const cl=SET().coutsLead;
  const rows=sources.map(s=>{ const L=all.filter(d=>(d.source||"Autre")===s); const Lp=L.filter(d=>d.createdAt>=from);
    const inst=L.filter(d=>Number(d.etape)>=7 && Number(d.etape)!==0); const instP=inst.filter(d=>new Date(d.dateInstallation||d.datePose).getTime()>=from);
    const cout=(Number(cl[s])||0)*Lp.length+sum(instP,d=>num(d.commission));
    return {s,leads:Lp.length,inst:instP.length,taux:Lp.length?Math.round(100*Lp.filter(d=>Number(d.etape)>=7).length/Lp.length):null,mg:sum(instP,margePrev),cout,cpi:instP.length?cout/instP.length:null}; })
    .filter(r=>r.leads||r.inst).sort((a,b)=>b.mg-a.mg);
  const funnel=ETAPES.filter(e=>e.n>0).map(e=>({l:e.l,n:all.filter(d=>Number(d.etape)===e.n).length}));
  const maxF=Math.max(1,...funnel.map(f=>f.n));
  return `<div class="row" style="gap:8px;margin-bottom:12px"><span class="small muted grow">Période</span>${[3,6,12].map(p=>`<button class="chip ${per===p?"on":""}" data-mact="per" data-v="${p}">${p} mois</button>`).join("")}</div>
  <div class="grid kpis">
    <div class="card kpi"><div class="v">${poses.length}</div><div class="l">Chantiers posés</div></div>
    <div class="card kpi"><div class="v money">${eur(ca)}</div><div class="l">CA posé (CEE + MPR + RAC)</div></div>
    <div class="card kpi"><div class="v money ${mg<0?"neg":""}">${eur(mg)}</div><div class="l">Marge prévisionnelle · ${poses.length?eur(mg/poses.length):"—"} / chantier</div></div>
    <div class="card kpi"><div class="v">${delais.length?Math.round(delais.reduce((a,b)=>a+b,0)/delais.length)+" j":"—"}</div><div class="l">Délai moyen lead → pose</div></div>
  </div>
  <h2>CA et marge par mois</h2>
  <div class="card">${barChart(byM)}</div>
  <h2>Rentabilité par source</h2>
  <div class="card scroll-x" style="padding:4px 8px"><table class="t"><thead><tr><th>Source</th><th class="r">Leads</th><th class="r">Posés</th><th class="r">Transfo</th><th class="r">Coût acquisition</th><th class="r">Coût / chantier</th><th class="r">Marge</th></tr></thead><tbody>
  ${rows.map(r=>`<tr style="cursor:default"><td><b>${esc(r.s)}</b></td><td class="r">${r.leads}</td><td class="r">${r.inst}</td><td class="r">${r.taux==null?"—":r.taux+" %"}</td><td class="r money">${eur(r.cout)}</td><td class="r money">${r.cpi==null?"—":eur(r.cpi)}</td><td class="r money ${r.mg<0?"neg":""}">${eur(r.mg)}</td></tr>`).join("")||'<tr><td colspan="7" class="empty">Pas encore de données sur la période.</td></tr>'}
  </tbody></table><div class="small muted" style="padding:6px">Coût acquisition = prix du lead (Réglages) × leads + commissions des chantiers posés. Les dossiers importés « à vérifier » sont exclus des leads.</div></div>
  <h2>Entonnoir actuel</h2>
  <div class="card grid" style="gap:6px">${funnel.map(f=>`<div class="row" style="gap:8px"><span class="small" style="width:150px">${esc(f.l)}</span><div class="grow" style="background:var(--line);border-radius:6px;height:16px;overflow:hidden"><div style="width:${Math.round(100*f.n/maxF)}%;height:100%;background:var(--brand-2)"></div></div><b style="width:36px;text-align:right">${f.n}</b></div>`).join("")}</div>`;
}
function barChart(rows){
  const W=640,H=220,pl=46,pb=26,pt=10; const max=Math.max(1000,...rows.map(r=>Math.max(r.ca,r.mg)));
  const step=(W-pl)/rows.length; const bw=Math.min(26,step/3);
  const y=v=>H-pb-(H-pb-pt)*Math.max(0,v)/max;
  const ticks=[0,.25,.5,.75,1].map(k=>k*max);
  const mois=m=>{ const [a,b]=m.split("-"); return new Date(a,b-1,1).toLocaleDateString("fr-FR",{month:"short"}); };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="CA et marge par mois">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(t/1000)}k</text>`).join("")}
    ${rows.map((r,i)=>{ const x=pl+i*step+step/2; return `<rect x="${x-bw-1}" y="${y(r.ca)}" width="${bw}" height="${H-pb-y(r.ca)}" rx="3" fill="var(--brand-2)"><title>${mois(r.m)} : CA ${eur(r.ca)} (${r.n} chantiers)</title></rect>
      <rect x="${x+1}" y="${y(r.mg)}" width="${bw}" height="${H-pb-y(r.mg)}" rx="3" fill="var(--accent)"><title>${mois(r.m)} : marge ${eur(r.mg)}</title></rect>
      <text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${mois(r.m)}</text>${r.n?`<text x="${x}" y="${y(r.ca)-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${r.n}</text>`:""}`; }).join("")}
  </svg><div class="row small muted" style="gap:14px"><span><span class="pastille" style="background:var(--brand-2);display:inline-block"></span> CA</span><span><span class="pastille" style="background:var(--accent);display:inline-block"></span> Marge</span><span>chiffre = nb de chantiers</span></div>`;
}
function viewPaiements(){

  return `<h2>Poseurs et capacité</h2><div class="card grid">${s.poseurs.map((p,i)=>`<div class="row" style="gap:8px"><input type="text" class="rs" data-rs="poseurs.${i}.nom" value="${esc(p.nom)}" class="grow"><label class="small muted row" style="gap:6px;white-space:nowrap">équipes <input type="text" inputmode="numeric" class="rs" data-rs="poseurs.${i}.capacite" value="${esc(p.capacite)}" style="width:60px"></label><button class="btn" data-mact="rmposeur" data-i="${i}">✕</button></div>`).join("")}
    <button class="btn" data-mact="addposeur">+ Ajouter un poseur</button><div class="small muted">Les codes PIN se règlent dans l'onglet « Config » de ta Google Sheet.</div></div>
  <h2>Coût d'un lead par source</h2><div class="card form">${Object.keys(s.coutsLead).map(k=>`<label class="f"><span>${esc(k)} (€)</span><input type="text" inputmode="decimal" class="rs" data-rs="coutsLead.${esc(k)}" value="${esc(s.coutsLead[k])}"></label>`).join("")}</div>
  <h2>Fournisseurs</h2><div class="card grid">${s.fournisseurs.map((f,i)=>`<div class="form"><label class="f"><span>Nom</span><input type="text" class="rs" data-rs="fournisseurs.${i}.nom" value="${esc(f.nom)}"></label><label class="f"><span>E-mail commandes</span><input type="email" class="rs" data-rs="fournisseurs.${i}.email" value="${esc(f.email)}"></label></div>`).join("")}</div>
  <h2>Société (messages et documents)</h2><div class="card form">${[["nom","Nom commercial"],["tel","Téléphone"],["mobile","Mobile"],["email","E-mail"],["site","Site web"],["avisGoogle","Lien avis Google"]].map(([k,l])=>`<label class="f ${k==="avisGoogle"?"full":""}"><span>${l}</span><input type="text" class="rs" data-rs="societe.${k}" value="${esc(s.societe[k]||"")}"></label>`).join("")}</div>
  <h2>Modèles de messages</h2><div class="small muted" style="margin:-4px 0 8px">Variables : {prenom} {nom} {date_pose} {poseur} {pieces} {societe} {tel_societe} {avis_google}</div>
  <div class="grid">${s.modeles.map((m,i)=>`<div class="card grid"><input type="text" class="rs" data-rs="modeles.${i}.nom" value="${esc(m.nom)}" style="font-weight:600"><textarea class="rs" data-rs="modeles.${i}.txt">${esc(m.txt)}</textarea><button class="btn" data-mact="rmmodele" data-i="${i}">Supprimer ce modèle</button></div>`).join("")}<button class="btn" data-mact="addmodele">+ Nouveau modèle</button></div>
  <button class="btn primary block" style="margin-top:14px" data-mact="savesettings">Enregistrer les réglages</button>`;
}
function setPath(obj,path,val){ const ks=path.split("."); let o=obj; for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null) o[k]=/^\d+$/.test(ks[i+1])?[]:{}; o=o[k]; } o[ks[ks.length-1]]=val; }
function editableSettings(){ if(!CFG.settings) CFG.settings=JSON.parse(JSON.stringify(SET())); for(const k of Object.keys(DEFAULT_SET)) if(CFG.settings[k]==null) CFG.settings[k]=JSON.parse(JSON.stringify(DEFAULT_SET[k])); return CFG.settings; }

/* ============================================================
   Événements du lot 1
   ============================================================ */
document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-mact]"); if(!b) return;
  const act=b.dataset.mact; const id=b.dataset.id; const d=id?S.dossiers.get(id):S.dossiers.get(S.param);
  if(b.tagName==="INPUT") { if(act==="toggleperdus"){ S.showPerdus=b.checked; render(); } return; }
  if(act==="plmove" && e.target.closest(".pchip")){ e.preventDefault(); e.stopPropagation(); openPlanMove(d); return; }
  e.preventDefault(); e.stopPropagation();
  switch(act){
    case "kadvance": { const n=Number(d.etape); if(n>=9||n===0) break; setEtape(d,n+1); await saveDossier(d); toast(fullName(d)+" → "+etapeLabel(d.etape)); render(); break; }
    case "dossview": S.dossView=b.dataset.v; try{localStorage.setItem("ecoroy_dossview",S.dossView)}catch(_){ } render(); break;
    case "mapgroupe": { const g=S.mapF.groupes; const i=g.indexOf(b.dataset.k); if(i>=0) g.splice(i,1); else g.push(b.dataset.k); S._keepMap=true; render(); break; }
    case "mapmode": S.mapF.mode=b.dataset.v; S._keepMap=true; render(); break;
    case "week": { const cur=S.week?new Date(S.week):mondayOf(new Date()); if(b.dataset.v==="0") S.week=null; else { cur.setDate(cur.getDate()+7*Number(b.dataset.v)); S.week=cur.getTime(); } render(); break; }
    case "plsave": { const day=$("#pmDate").value; d.dureeJours=$("#pmDuree").value||1; closeModal(); if(day) await placePose(d,day,$("#pmPoseur").value); else { d.poseur=$("#pmPoseur").value; await saveDossier(d); render(); } break; }
    case "gtab": S.gtab=b.dataset.v; render(); break;
    case "per": S.per=Number(b.dataset.v); render(); break;
    case "payer": { const t=b.dataset.type; if(!(await confirmBox(`Marquer ${t==="poseur"?"la pose":"la commission"} de ${fullName(d)} comme payée ?`))) break; if(t==="poseur") d.poseurPayeLe=today(); else d.commissionPayeeLe=today(); await saveDossier(d); render(); break; }
    case "cmdok": { d.dateCommande=today(); await saveDossier(d); toast("Commande notée"); render(); break; }
    case "livre": d.livreLe=today(); await saveDossier(d); toast("Livraison notée"); render(); break;
    case "cmdmail": { const m=bonCommandeMail(d); if(!m.to) toast("Ajoute l'e-mail de "+(d.fournisseur||"ce fournisseur")+" dans Réglages");
      location.href=`mailto:${encodeURIComponent(m.to)}?subject=${encodeURIComponent(m.sujet)}&body=${encodeURIComponent(m.corps)}`; await logComm(d,"commande",d.fournisseur||"",m.sujet); break; }
    case "contact": openContact(d); break;
    case "ctpl": S.ctpl=b.dataset.v; openContact(d); break;
    case "send": { const c=b.dataset.c; const txt=($("#ctxt")||{}).value||""; const m=(SET().modeles.find(x=>x.id===(S.ctpl||SET().modeles[0].id))||{}).nom||"";
      const tel=String(d.tel||"").replace(/[^\d+]/g,"");
      const url = c==="sms" ? `sms:${tel}${/iPhone|iPad|Mac/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(txt)}` : c==="whatsapp" ? `https://wa.me/${telIntl(d.tel)}?text=${encodeURIComponent(txt)}` : c==="mail" ? `mailto:${encodeURIComponent(d.email)}?subject=${encodeURIComponent(SET().societe.nom+" — votre projet")}&body=${encodeURIComponent(txt)}` : `tel:${tel}`;
      await logComm(d,c,c==="appel"?"":m,c==="appel"?"":txt); closeModal();
      if(c==="whatsapp") window.open(url,"_blank"); else location.href=url; break; }
    case "addposeur": editableSettings().poseurs.push({nom:"Nouveau",capacite:1}); render(); break;
    case "rmposeur": editableSettings().poseurs.splice(Number(b.dataset.i),1); render(); break;
    case "addmodele": editableSettings().modeles.push({id:"m"+Date.now(),nom:"Nouveau modèle",txt:"Bonjour {prenom}, "}); render(); break;
    case "rmmodele": editableSettings().modeles.splice(Number(b.dataset.i),1); render(); break;
    case "savesettings": await pushSettings(); render(); break;
  }
}, true);
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="mapPoseur"){ S.mapF.poseur=el.value; S._keepMap=true; render(); return; }
  if(el.classList && el.classList.contains("rs")){ const v=el.value; setPath(editableSettings(), el.dataset.rs, /capacite|coutsLead/.test(el.dataset.rs)?num(v):v); }
});
// Glisser-déposer (ordinateur) : kanban et planning
document.addEventListener("dragstart", e=>{ const c=e.target.closest&&e.target.closest("[data-drag-id]"); if(!c) return; e.dataTransfer.setData("text/plain",c.dataset.dragId); e.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); });
document.addEventListener("dragend", e=>{ document.querySelectorAll(".dragging,.dropover").forEach(x=>x.classList.remove("dragging","dropover")); });
document.addEventListener("dragover", e=>{ const t=e.target.closest&&e.target.closest("[data-drop-etape],[data-drop-day]"); if(!t) return; e.preventDefault(); document.querySelectorAll(".dropover").forEach(x=>x!==t&&x.classList.remove("dropover")); t.classList.add("dropover"); });
document.addEventListener("drop", async e=>{
  const t=e.target.closest&&e.target.closest("[data-drop-etape],[data-drop-day]"); if(!t) return; e.preventDefault();
  const d=S.dossiers.get(e.dataTransfer.getData("text/plain")); if(!d) return;
  if(t.dataset.dropEtape!==undefined){ const n=Number(t.dataset.dropEtape); if(n!==Number(d.etape)){ setEtape(d,n); await saveDossier(d); toast(fullName(d)+" → "+etapeLabel(n)); render(); } }
  else await placePose(d, t.dataset.dropDay, t.dataset.dropPoseur);
});

/* ---------- Démarrage ---------- */
(async function boot(){
  const m=location.hash.match(/serveur=([^&]+)/);
  if(m && !CFG.role){ CFG._preUrl=decodeURIComponent(m[1]); S.loginMode="poseur"; history.replaceState(null,"",location.pathname); }
  try{ await DB.open(); await loadAll(); }catch(e){ document.body.innerHTML='<p style="padding:20px">Stockage local indisponible sur ce navigateur (navigation privée ?).</p>'; return; }
  S.view = isPoseur()?"poseur":"dash";
  render();
  if(CFG.role && CFG.role!=="demo") syncNow();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
// remember the list we came from when opening a dossier
document.addEventListener("click",e=>{ if(e.target.closest("[data-open]") && S.view!=="dossier") S.prevView=S.view; },true);
</script>
